name: Publish ISRM to Cloudflare Pages

on:
  push:
    branches: [codex/network-workflow-batch]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isrm-pages-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'AlexezavGit/isrm-insight-hub' && github.ref == 'refs/heads/codex/network-workflow-batch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the approved source branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify application behaviour
        run: node --import tsx --test src/lib/*.test.ts
      - name: Build the Pages application
        run: npm run build
        env:
          NITRO_PRESET: cloudflare-pages
      - name: Prepare the public release
        run: node scripts/prepare-pages-release.mjs
        env:
          ISRM_RELEASE_SHA: ${{ github.sha }}
      - name: Verify the existing production destination
        id: target
        run: node scripts/pages-deployment-target.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Publish to the existing isrm Pages project
        run: node scripts/deploy-pages.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ISRM_PRODUCTION_BRANCH: ${{ steps.target.outputs.production_branch }}
          ISRM_RELEASE_SHA: ${{ github.sha }}
      - name: Check the published site
        run: node scripts/check-pages-release.mjs
        env:
          ISRM_RELEASE_SHA: ${{ github.sha }}

name: Deploy to Cloudflare Pages

# CI/CD pipeline per handoff §2 governance + user authorisation (Oct 2026):
# - Triggers on push to `isrm-partner-ranges-v1` (live working state) and `main`.
# - Pull requests build but do not deploy.
# - Uses CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets stored in GitHub repo settings.
# - Build uses NITRO_PRESET=cloudflare-pages (matches `npm run build`).
# - Deploy via cloudflare/wrangler-action@v3 (modern equivalent of cloudflare/pages-action).
#
# Setup instructions for the maintainer (one-time):
#   1. Generate a Cloudflare API token with "Cloudflare Pages — Edit" permission at
#      https://dash.cloudflare.com/profile/api-tokens
#   2. In GitHub repo → Settings → Secrets and variables → Actions → New repository secret:
#      - Name: CLOUDFLARE_API_TOKEN  · Value: <the token from step 1>
#      - Name: CLOUDFLARE_ACCOUNT_ID · Value: <your Cloudflare account ID>
#   3. Push to `isrm-partner-ranges-v1` to trigger the first auto-deploy.

on:
  push:
    branches:
      - isrm-partner-ranges-v1
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (Cloudflare Pages preset)
        env:
          NITRO_PRESET: cloudflare-pages
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=isrm --branch=${{ github.ref_name }}
